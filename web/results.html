<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نتائج الاختبار</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/results.js"></script>
</head>
<body data-page-title="nav.results">
  <header class="topbar">
    <div class="brand">
      <h1 data-i18n="app.title"></h1>
    </div>
    <nav class="pages">
      <a href="/" data-i18n="nav.alerts"></a>
      <a href="/results" aria-current="page" data-i18n="nav.results"></a>
    </nav>
    <div class="session">
      <span id="health" class="health" role="status"></span>
      <button id="lang-switch" type="button" data-i18n="lang.switch"></button>
    </div>
  </header>

  <main>
    <h2 data-i18n="results.heading"></h2>
    <p id="results-missing" class="muted" hidden data-i18n="results.missing"></p>
    <div id="results" hidden>
      <p class="caveat" data-i18n="results.caveat"></p>
      <p data-i18n="results.split"></p>

      <section class="panel">
        <h3 data-i18n="results.choice.heading"></h3>
        <p><strong id="choice"></strong> <span data-i18n="results.reason"></span></p>
      </section>

      <section class="panel">
        <h3 data-i18n="results.scores.heading"></h3>
        <div class="table-wrap">
          <table class="scores">
            <thead><tr>
              <th data-i18n="col.detector"></th>
              <th data-i18n="col.class"></th>
              <th data-i18n="col.precision"></th>
              <th data-i18n="col.recall"></th>
              <th data-i18n="col.ap50"></th>
              <th data-i18n="col.counts"></th>
              <th data-i18n="col.threshold"></th>
              <th data-i18n="col.speed"></th>
            </tr></thead>
            <tbody id="scores-body"></tbody>
          </table>
        </div>
        <p class="muted small" data-i18n="results.scores.note"></p>
      </section>

      <section class="panel">
        <h3 data-i18n="results.fa.heading"></h3>
        <p id="fa-note" class="muted small"></p>
        <div class="table-wrap" id="fa-table">
          <table>
            <thead><tr>
              <th data-i18n="col.clip"></th>
              <th data-i18n="col.seconds"></th>
              <th data-i18n="col.frames"></th>
              <th data-i18n="col.alertingFrames"></th>
              <th data-i18n="col.falseAlarms"></th>
            </tr></thead>
            <tbody id="fa-body"></tbody>
          </table>
        </div>
      </section>

      <section>
        <h3 data-i18n="results.images.heading"></h3>
        <p class="muted small" data-i18n="results.images.legend"></p>
        <div class="detector-switch">
          <span data-i18n="results.images.show"></span>
          <span id="detector-buttons" class="chips"></span>
        </div>
        <div id="test-images" class="test-images"></div>
      </section>
    </div>
  </main>
</body>
</html>
