[project]
name = "wd"
version = "0.1.0"
description = "Weapon detection PoC: boxes around guns and knives in CCTV stills and videos, with alerts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "numpy",
    "pillow",
    "torch",
    "torchvision",
    "transformers",
    "rfdetr[train]",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
